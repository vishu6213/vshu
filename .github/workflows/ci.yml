# Fast checks on every push and pull request: types, lint, the rebrand guard and the
# script tests. Releases are built by release.yml.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebrand guard
        run: node scripts/vshu-rebrand.mjs --check

      - name: Script tests
        run: node --test scripts/sync-upstream.test.mjs scripts/release-vshu.test.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm exec oxlint
