name: Vshu Mobile Builds (iOS & Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - name: Install mobile dependencies
        run: pnpm --dir mobile install --no-frozen-lockfile
      - name: Typecheck & test mobile app
        run: |
          node config/scripts/typecheck/project-execution/run-typecheck-projects-in-parallel.mjs --project=mobile/tsconfig.json
          node mobile/node_modules/vitest/vitest.mjs --root mobile run

  build-android:
    needs: verify-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - name: Install mobile dependencies
        run: pnpm --dir mobile install --no-frozen-lockfile
      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build Android Release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vshu-mobile-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release*.apk

  build-ios:
    needs: verify-mobile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - name: Install mobile dependencies
        run: pnpm --dir mobile install --no-frozen-lockfile
      - name: Prebuild iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Build unsigned iOS Archive
        working-directory: mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vshu-mobile-ios-build
          path: mobile/ios/build/
